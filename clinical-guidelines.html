<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Clinical Guidelines & Decision Support | MiracardiacHealth HMS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{primary:{DEFAULT:'#0d9488'}},fontFamily:{sans:['Inter','system-ui','sans-serif']}}}}</script>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    body{padding-bottom:40px}
    .card{background:#fff;border:1px solid #e2e8f0;border-radius:1rem;padding:1rem}
    .guide{cursor:pointer;transition:all .15s}
    .guide:hover{border-color:#99f6e4;box-shadow:0 4px 12px rgba(13,148,136,.1)}
  </style>
</head>
<body class="bg-slate-50 text-slate-900">
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-slate-200">
    <div class="max-w-3xl mx-auto px-4 h-14 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="hms-hub.html" class="text-slate-500 text-lg">←</a>
        <div>
          <h1 class="font-extrabold text-base">Clinical Guidelines</h1>
          <p class="text-[10px] text-slate-400">Evidence-based protocols & decision support</p>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-4 space-y-4">
    <div class="relative">
      <input id="search" class="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm" placeholder="Search guidelines (malaria, sepsis, hypertension...)" />
    </div>

    <div id="guides" class="space-y-2">
      <!-- Pre-loaded high-value guidelines for LMIC / global best practice -->
    </div>

    <div id="detail" class="hidden card space-y-3">
      <button id="backList" class="text-xs font-bold text-teal-700">← Back to list</button>
      <h2 id="dTitle" class="font-extrabold text-lg"></h2>
      <div id="dBody" class="prose prose-sm text-slate-700 space-y-2 text-sm"></div>
      <p class="text-[10px] text-slate-400 mt-4">These summaries support clinical judgment and do not replace full institutional protocols, national guidelines or specialist advice. Always verify drug doses and local resistance patterns.</p>
    </div>
  </main>

  <script type="module">
    import { requireAuth, applyPlatformBranding } from './js/config.js';
    applyPlatformBranding();
    await requireAuth(['doctor','nurse','admin','surgeon','lab','pharmacist','student']);

    const GUIDES = [
      {
        id: 'sepsis',
        title: 'Sepsis / Septic Shock – Hour-1 Bundle',
        tags: 'sepsis infection shock antibiotics lactate',
        body: `
          <p><strong>Recognize:</strong> Suspected infection + organ dysfunction (qSOFA ≥2: RR≥22, altered mentation, SBP≤100).</p>
          <p><strong>Within 1 hour:</strong></p>
          <ul class="list-disc pl-5 space-y-1">
            <li>Measure lactate</li>
            <li>Obtain blood cultures before antibiotics</li>
            <li>Administer broad-spectrum antibiotics</li>
            <li>Begin 30 mL/kg crystalloid for hypotension or lactate ≥4</li>
            <li>Apply vasopressors if hypotensive during/after fluid to maintain MAP ≥65</li>
          </ul>
          <p>Reassess volume status and tissue perfusion frequently. Source control as soon as feasible.</p>`
      },
      {
        id: 'malaria',
        title: 'Severe Malaria – Recognition & Treatment',
        tags: 'malaria plasmodium artesunate fever coma',
        body: `
          <p><strong>Severe features:</strong> impaired consciousness, prostration, multiple convulsions, acidosis, hypoglycemia, severe anaemia, renal impairment, jaundice with parasite count, pulmonary oedema, significant bleeding, shock, hyperparasitaemia.</p>
          <p><strong>Treatment (adults):</strong> IV artesunate 2.4 mg/kg at 0, 12, 24 h then daily until oral possible. Complete full course with ACT. Supportive care for complications. Do not use oral therapy alone for severe disease.</p>
          <p>Check local guidelines for paediatric dosing and resistance.</p>`
      },
      {
        id: 'acs',
        title: 'Acute Coronary Syndrome – Initial Management',
        tags: 'mi heart attack chest pain stemi nstemi aspirin',
        body: `
          <p><strong>ABC, oxygen if SpO₂ &lt;90%, IV access, continuous monitoring.</strong></p>
          <p><strong>Immediate:</strong> Aspirin 150–300 mg chewed, P2Y12 inhibitor as per protocol, anticoagulation, analgesia (morphine/fentanyl), anti-emetic.</p>
          <p><strong>STEMI:</strong> Activate reperfusion pathway (PCI preferred; fibrinolysis if PCI cannot be performed in time and no contraindications).</p>
          <p>Serial ECGs, troponin, risk stratification for NSTE-ACS.</p>`
      },
      {
        id: 'stroke',
        title: 'Acute Ischaemic Stroke – Time-Critical Care',
        tags: 'stroke cva thrombolysis tpa nihss',
        body: `
          <p>Face–Arm–Speech–Time. Rapid ABC, glucose, ECG. Urgent non-contrast CT to exclude haemorrhage.</p>
          <p>If within window and criteria met: IV thrombolysis / endovascular therapy per local stroke pathway. BP management, nil by mouth until swallow assessed, avoid hypo/hyperglycaemia.</p>`
      },
      {
        id: 'htn-emergency',
        title: 'Hypertensive Emergency',
        tags: 'hypertension crisis bp encephalopathy',
        body: `
          <p>Severe BP elevation + acute end-organ damage (encephalopathy, ACS, acute heart failure, aortic dissection, eclampsia, etc.).</p>
          <p>Admit high-dependency/ICU. Controlled reduction of MAP (typically ≤25% in first hour) with IV agents (labetalol, nicardipine, nitroprusside – availability dependent). Avoid rapid drops that cause ischaemia.</p>`
      },
      {
        id: 'dka',
        title: 'Diabetic Ketoacidosis (DKA)',
        tags: 'diabetes dka ketoacidosis insulin glucose',
        body: `
          <p><strong>Diagnosis:</strong> Hyperglycaemia, ketonaemia/ketonuria, acidosis.</p>
          <p><strong>Priorities:</strong> Fluid resuscitation, insulin infusion, potassium replacement (monitor closely), identify and treat trigger (infection, omission of insulin). Transition to subcutaneous insulin when criteria met. Watch for cerebral oedema in children/young adults.</p>`
      },
      {
        id: 'asthma',
        title: 'Acute Severe Asthma',
        tags: 'asthma wheeze nebuliser steroid',
        body: `
          <p>Oxygen to target SpO₂ 94–98%. Nebulised salbutamol ± ipratropium. Systemic corticosteroids early. Consider magnesium sulphate IV for severe/life-threatening. Escalate if not improving (senior review, ICU).</p>`
      },
      {
        id: 'anaphylaxis',
        title: 'Anaphylaxis',
        tags: 'allergy anaphylaxis adrenaline epinephrine',
        body: `
          <p><strong>IM adrenaline (epinephrine) 0.5 mg (1:1000) anterolateral thigh – repeat after 5 min if needed.</strong> Lie flat, elevate legs if possible. Oxygen, IV fluids, antihistamine and steroid as adjuncts. Observe for biphasic reaction. Document allergen and refer for allergy follow-up.</p>`
      },
      {
        id: 'postop',
        title: 'Post-Operative Care Essentials',
        tags: 'surgery postoperative recovery pain wound',
        body: `
          <p>ABC, pain control, fluid balance, early mobilisation, VTE prophylaxis, wound inspection, nausea control, monitoring for bleeding/infection/respiratory complications. Clear escalation criteria to surgical team.</p>`
      },
      {
        id: 'infection-control',
        title: 'Infection Prevention & Control Basics',
        tags: 'ipc hand hygiene isolation ppe mdr',
        body: `
          <p>Hand hygiene (WHO 5 Moments), appropriate PPE, isolation precautions for MDRO/respiratory pathogens, aseptic technique, antibiotic stewardship, environmental cleaning, sharps safety. Report outbreaks promptly.</p>`
      },
      {
        id: 'maternal',
        title: 'Obstetric Emergencies – Red Flags',
        tags: 'obstetric pph eclampsia maternal',
        body: `
          <p>Post-partum haemorrhage, eclampsia/pre-eclampsia, obstructed labour, sepsis, amniotic fluid embolism. Early senior obstetric and anaesthetic involvement. PPH: uterine massage, uterotonics, tranexamic acid, blood products, surgical escalation.</p>`
      },
      {
        id: 'paeds-resus',
        title: 'Paediatric Basic Life Support Priorities',
        tags: 'paediatric children resus abc',
        body: `
          <p>Airway, breathing, circulation with age-appropriate techniques and equipment. Weight-based drug dosing (use length-based tape if available). Hypoglycaemia and hypothermia are common contributors – check and correct.</p>`
      }
    ];

    const listEl = document.getElementById('guides');
    const detail = document.getElementById('detail');

    function render(filter = '') {
      const q = filter.toLowerCase();
      const filtered = GUIDES.filter(g => !q || g.title.toLowerCase().includes(q) || g.tags.includes(q));
      listEl.innerHTML = filtered.map(g => `
        <div class="card guide" data-id="${g.id}">
          <div class="font-bold text-sm">${g.title}</div>
          <div class="text-[11px] text-slate-400 mt-0.5">${g.tags.split(' ').slice(0,5).join(' · ')}</div>
        </div>
      `).join('') || '<p class="text-sm text-slate-500">No matching guidelines.</p>';
      listEl.querySelectorAll('.guide').forEach(el => {
        el.onclick = () => show(el.dataset.id);
      });
    }

    function show(id) {
      const g = GUIDES.find(x => x.id === id);
      if (!g) return;
      listEl.classList.add('hidden');
      detail.classList.remove('hidden');
      document.getElementById('dTitle').textContent = g.title;
      document.getElementById('dBody').innerHTML = g.body;
    }

    document.getElementById('backList').onclick = () => {
      detail.classList.add('hidden');
      listEl.classList.remove('hidden');
    };
    document.getElementById('search').oninput = e => render(e.target.value);
    render();
  </script>
</body>
</html>
