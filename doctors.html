<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d9488" />
  <title>Find a Doctor | MiracardiacHealth</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{primary:{DEFAULT:'#0d9488',dark:'#0f766e'},secondary:'#059669'},fontFamily:{sans:['Inter','system-ui','sans-serif']}}}}</script>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://js.paystack.co/v1/inline.js"></script>
</head>
<body class="bg-slate-50">
  <header class="sticky top-0 z-40 bg-white border-b border-slate-200 safe-top">
    <div class="max-w-lg mx-auto px-4 h-14 flex items-center gap-3">
      <a href="index.html" class="text-slate-500 text-lg">←</a>
      <h1 class="font-bold text-lg flex-1">Find a Doctor</h1>
    </div>
  </header>

  <main class="max-w-lg mx-auto px-4 py-4">
    <!-- Search & Filter -->
    <div class="space-y-3 mb-5">
      <input id="searchInput" type="search" placeholder="Search by name or specialty..." class="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm bg-white" />
      <div class="flex gap-2 overflow-x-auto no-scrollbar">
        <button data-spec="all" class="spec-btn active shrink-0 px-3 py-1.5 rounded-full text-xs font-medium bg-teal-600 text-white">All</button>
        <button data-spec="General Practice" class="spec-btn shrink-0 px-3 py-1.5 rounded-full text-xs font-medium bg-white border border-slate-200 text-slate-600">General</button>
        <button data-spec="Pediatrics" class="spec-btn shrink-0 px-3 py-1.5 rounded-full text-xs font-medium bg-white border border-slate-200 text-slate-600">Pediatrics</button>
        <button data-spec="Cardiology" class="spec-btn shrink-0 px-3 py-1.5 rounded-full text-xs font-medium bg-white border border-slate-200 text-slate-600">Cardiology</button>
        <button data-spec="Dermatology" class="spec-btn shrink-0 px-3 py-1.5 rounded-full text-xs font-medium bg-white border border-slate-200 text-slate-600">Dermatology</button>
        <button data-spec="Gynecology" class="spec-btn shrink-0 px-3 py-1.5 rounded-full text-xs font-medium bg-white border border-slate-200 text-slate-600">Gynecology</button>
        <button data-spec="Psychiatry" class="spec-btn shrink-0 px-3 py-1.5 rounded-full text-xs font-medium bg-white border border-slate-200 text-slate-600">Psychiatry</button>
        <button data-spec="Orthopedics" class="spec-btn shrink-0 px-3 py-1.5 rounded-full text-xs font-medium bg-white border border-slate-200 text-slate-600">Orthopedics</button>
      </div>
    </div>

    <div id="doctorsList" class="space-y-3">
      <div class="ah-card p-4 skeleton h-28"></div>
      <div class="ah-card p-4 skeleton h-28"></div>
      <div class="ah-card p-4 skeleton h-28"></div>
    </div>
  </main>

  <!-- Consult Modal -->
  <div id="consultModal" class="fixed inset-0 z-50 hidden items-end sm:items-center justify-center bg-black/40">
    <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 max-h-[85vh] overflow-y-auto">
      <div class="flex justify-between items-start mb-4">
        <h2 class="font-bold text-lg">Start Consultation</h2>
        <button id="closeModal" class="text-slate-400 text-xl">×</button>
      </div>
      <div id="modalContent"></div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>Home</a>
    <a href="doctors.html" class="active"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>Doctors</a>
    <a href="pharmacy-search.html"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>Pharmacy</a>
    <a href="Dashboard.html"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>Dashboard</a>
  </nav>

  <script type="module">
    import {auth, db, requireAuth, showToast, showLoading, showEmpty, escapeHtml, formatCurrency,
      collection, query, where, orderBy, getDocs, addDoc, doc, getDoc, serverTimestamp,
      payWithPaystack, generateRef, applyPlatformBranding} from './js/config.js';

    applyPlatformBranding();
    let allDoctors = [];
    let currentSpec = 'all';
    let currentUser = null;

    requireAuth().then(p => { currentUser = p; });

    // Specialty filter
    document.querySelectorAll('.spec-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.spec-btn').forEach(b => {
          b.classList.remove('active', 'bg-teal-600', 'text-white');
          b.classList.add('bg-white', 'border', 'border-slate-200', 'text-slate-600');
        });
        btn.classList.add('active', 'bg-teal-600', 'text-white');
        btn.classList.remove('bg-white', 'border', 'border-slate-200', 'text-slate-600');
        currentSpec = btn.dataset.spec;
        renderDoctors();
      });
    });

    document.getElementById('searchInput').addEventListener('input', renderDoctors);

    async function loadDoctors() {
      const el = document.getElementById('doctorsList');
      showLoading(el, 'Finding doctors...');
      try {
        const snap = await getDocs(query(collection(db, 'doctors'), where('status', '==', 'approved')));
        allDoctors = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderDoctors();
      } catch (e) {
        el.innerHTML = `<p class="text-red-500 text-sm text-center py-8">Failed to load doctors</p>`;
      }
    }

    function renderDoctors() {
      const el = document.getElementById('doctorsList');
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      let list = allDoctors;
      if (currentSpec !== 'all') list = list.filter(d => (d.specialty || '').toLowerCase().includes(currentSpec.toLowerCase()));
      if (q) list = list.filter(d => (d.name || '').toLowerCase().includes(q) || (d.specialty || '').toLowerCase().includes(q));

      if (!list.length) {
        showEmpty(el, 'No doctors match your search', '🔍');
        return;
      }

      el.innerHTML = list.map(d => `
        <div class="ah-card p-4">
          <div class="flex gap-3">
            <img src="${escapeHtml(d.photoURL || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(d.name || 'Dr') + '&background=0d9488&color=fff')}" class="w-16 h-16 rounded-xl object-cover shrink-0" alt="" />
            <div class="flex-1 min-w-0">
              <div class="flex items-start justify-between gap-2">
                <div>
                  <h3 class="font-semibold text-sm">${escapeHtml(d.name)}</h3>
                  <p class="text-xs text-teal-600 font-medium">${escapeHtml(d.specialty || 'General Practice')}</p>
                </div>
                <div class="text-right shrink-0">
                  <p class="font-bold text-sm text-emerald-700">${formatCurrency(d.consultationFee || 0)}</p>
                  <p class="text-[10px] text-slate-400">per consult</p>
                </div>
              </div>
              <div class="flex items-center gap-2 mt-1.5 text-xs text-slate-500">
                <span>⭐ ${(d.rating || 0).toFixed(1)}</span>
                <span>·</span>
                <span>${d.experience || 0} yrs exp</span>
                <span>·</span>
                <span class="${d.available ? 'text-emerald-600' : 'text-slate-400'}">${d.available ? 'Available' : 'Busy'}</span>
              </div>
              <button data-id="${d.id}" class="consult-btn mt-3 w-full btn-primary text-sm py-2">Consult Now</button>
            </div>
          </div>
        </div>`).join('');

      el.querySelectorAll('.consult-btn').forEach(btn => {
        btn.addEventListener('click', () => openConsultModal(btn.dataset.id));
      });
    }

    async function openConsultModal(doctorId) {
      if (!currentUser) {
        showToast('Please login first', 'warning');
        setTimeout(() => location.href = 'Login.html', 1000);
        return;
      }
      const doctor = allDoctors.find(d => d.id === doctorId);
      if (!doctor) return;

      const modal = document.getElementById('consultModal');
      const content = document.getElementById('modalContent');
      content.innerHTML = `
        <div class="flex gap-3 mb-4">
          <img src="${escapeHtml(doctor.photoURL || '')}" class="w-14 h-14 rounded-xl object-cover" />
          <div>
            <p class="font-semibold">${escapeHtml(doctor.name)}</p>
            <p class="text-sm text-teal-600">${escapeHtml(doctor.specialty || '')}</p>
            <p class="text-sm font-bold text-emerald-700 mt-0.5">${formatCurrency(doctor.consultationFee || 0)}</p>
          </div>
        </div>
        <p class="text-xs text-slate-500 mb-4">After payment, an admin will review and activate your chat (usually within a few hours). Chat stays open for 7 days.</p>
        <label class="block text-xs font-medium text-slate-600 mb-1">Brief reason for consult (optional)</label>
        <textarea id="consultReason" rows="2" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm mb-4" placeholder="e.g. Persistent headache for 3 days..."></textarea>
        <button id="payBtn" class="btn-primary w-full">Pay ${formatCurrency(doctor.consultationFee || 0)} & Request Consult</button>
      `;
      modal.classList.remove('hidden');
      modal.classList.add('flex');

      document.getElementById('payBtn').onclick = async () => {
        const reason = document.getElementById('consultReason').value.trim();
        const fee = doctor.consultationFee || 0;
        const ref = generateRef('CONSULT');
        const btn = document.getElementById('payBtn');
        btn.disabled = true;
        btn.textContent = 'Processing...';

        payWithPaystack({
          email: currentUser.email,
          amount: fee,
          reference: ref,
          metadata: { doctorId, patientId: currentUser.uid, purpose: 'consultation' },
          onSuccess: async (response) => {
            try {
              // Create consultation record (status paid_pending until admin approves)
              await addDoc(collection(db, 'consultations'), {
                patientId: currentUser.uid,
                patientName: currentUser.displayName || currentUser.email,
                doctorId: doctor.id,
                doctorName: doctor.name,
                fee,
                reason,
                status: 'paid_pending',
                paymentRef: response.reference,
                paymentStatus: 'success',
                createdAt: serverTimestamp(),
                updatedAt: serverTimestamp()
              });
              // Also log payment (client-side record; server webhook should verify)
              await addDoc(collection(db, 'payments'), {
                userId: currentUser.uid,
                amount: fee,
                reference: response.reference,
                purpose: 'consultation',
                status: 'success',
                metadata: { doctorId },
                createdAt: serverTimestamp()
              });
              showToast('Payment successful! Awaiting admin approval.', 'success');
              modal.classList.add('hidden');
              modal.classList.remove('flex');
            } catch (e) {
              showToast('Payment recorded but failed to create consult: ' + e.message, 'error');
            }
          },
          onCancel: () => {
            btn.disabled = false;
            btn.textContent = `Pay ${formatCurrency(fee)} & Request Consult`;
            showToast('Payment cancelled', 'warning');
          }
        });
      };
    }

    document.getElementById('closeModal').onclick = () => {
      document.getElementById('consultModal').classList.add('hidden');
      document.getElementById('consultModal').classList.remove('flex');
    };

    loadDoctors();
  </script>
</body>
</html>
