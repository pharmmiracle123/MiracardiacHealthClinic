<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Pharmacy Search | MiracardiacHealth</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{primary:{DEFAULT:'#0d9488',dark:'#0f766e'},secondary:'#059669'},fontFamily:{sans:['Inter','system-ui','sans-serif']}}}}</script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-slate-50">
  <header class="sticky top-0 z-40 bg-white border-b border-slate-200 safe-top">
    <div class="max-w-lg mx-auto px-4 h-14 flex items-center gap-3">
      <a href="index.html" class="text-slate-500">←</a>
      <h1 class="font-bold text-lg flex-1">Find Medicine</h1>
      <a href="cart.html" class="relative text-teal-600">
        🛒
        <span id="cartCount" class="absolute -top-1 -right-2 bg-red-500 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center hidden">0</span>
      </a>
    </div>
  </header>

  <main class="max-w-lg mx-auto px-4 py-4">
    <div class="mb-4">
      <input id="searchInput" type="search" placeholder="Search drug name..." class="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm bg-white" />
    </div>
    <div id="results" class="space-y-3">
      <p class="text-sm text-slate-400 text-center py-12">Search for a medicine to see available pharmacies</p>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="index.html"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>Home</a>
    <a href="doctors.html"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>Doctors</a>
    <a href="pharmacy-search.html" class="active"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>Pharmacy</a>
    <a href="Dashboard.html"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>Dashboard</a>
  </nav>

  <script type="module">
    import {db, showToast, showLoading, showEmpty, escapeHtml, formatCurrency, distanceKm,
      collection, query, where, getDocs, collectionGroup, applyPlatformBranding} from './js/config.js';

    applyPlatformBranding();
    // Simple cart in localStorage (one pharmacy at a time)
    function getCart() {
      try { return JSON.parse(localStorage.getItem('mh_cart') || '{"pharmacyId":null,"items":[]}'); }
      catch { return { pharmacyId: null, items: [] }; }
    }
    function saveCart(cart) {
      localStorage.setItem('mh_cart', JSON.stringify(cart));
      updateCartBadge();
    }
    function updateCartBadge() {
      const cart = getCart();
      const count = cart.items.reduce((s, i) => s + i.qty, 0);
      const el = document.getElementById('cartCount');
      if (count > 0) {
        el.textContent = count;
        el.classList.remove('hidden');
      } else el.classList.add('hidden');
    }
    updateCartBadge();

    let userLat = null, userLng = null;
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(pos => {
        userLat = pos.coords.latitude;
        userLng = pos.coords.longitude;
      });
    }

    let searchTimeout;
    document.getElementById('searchInput').addEventListener('input', (e) => {
      clearTimeout(searchTimeout);
      const q = e.target.value.trim();
      if (q.length < 2) {
        document.getElementById('results').innerHTML = `<p class="text-sm text-slate-400 text-center py-12">Type at least 2 characters</p>`;
        return;
      }
      searchTimeout = setTimeout(() => searchDrugs(q), 400);
    });

    async function searchDrugs(term) {
      const el = document.getElementById('results');
      showLoading(el, 'Searching pharmacies...');
      try {
        // Get approved pharmacies
        const pharmSnap = await getDocs(query(collection(db, 'pharmacies'), where('status', '==', 'approved')));
        const pharmacies = {};
        pharmSnap.forEach(d => { pharmacies[d.id] = { id: d.id, ...d.data() }; });

        // Search drugs across pharmacies (collection group)
        const drugSnap = await getDocs(collectionGroup(db, 'drugs'));
        const matches = [];
        drugSnap.forEach(d => {
          const data = d.data();
          if ((data.name || '').toLowerCase().includes(term.toLowerCase()) && data.stock > 0) {
            const pharmacyId = d.ref.parent.parent.id;
            if (pharmacies[pharmacyId]) {
              matches.push({
                drugId: d.id,
                pharmacyId,
                pharmacy: pharmacies[pharmacyId],
                ...data
              });
            }
          }
        });

        // Sort by price or distance
        matches.sort((a, b) => (a.price || 0) - (b.price || 0));

        if (!matches.length) {
          showEmpty(el, 'No pharmacies stock this medicine right now', '💊');
          return;
        }

        el.innerHTML = matches.map(m => {
          let dist = '';
          if (userLat && m.pharmacy.lat && m.pharmacy.lng) {
            dist = distanceKm(userLat, userLng, m.pharmacy.lat, m.pharmacy.lng).toFixed(1) + ' km';
          }
          return `
            <div class="ah-card p-4">
              <div class="flex justify-between items-start mb-1">
                <div>
                  <h3 class="font-semibold text-sm">${escapeHtml(m.name)}</h3>
                  <p class="text-xs text-slate-500">${escapeHtml(m.pharmacy.name)} ${dist ? '· ' + dist : ''}</p>
                </div>
                <p class="font-bold text-emerald-700">${formatCurrency(m.price)}</p>
              </div>
              <div class="flex items-center gap-2 text-xs text-slate-500 mb-2">
                <span>Stock: ${m.stock}</span>
                ${m.requiresPrescription ? '<span class="badge badge-pending">Rx required</span>' : ''}
              </div>
              <button data-drug='${JSON.stringify({ drugId: m.drugId, pharmacyId: m.pharmacyId, name: m.name, price: m.price, requiresPrescription: !!m.requiresPrescription })}' class="add-btn btn-primary text-sm py-2 w-full">Add to Cart</button>
            </div>`;
        }).join('');

        el.querySelectorAll('.add-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const item = JSON.parse(btn.dataset.drug);
            let cart = getCart();
            if (cart.pharmacyId && cart.pharmacyId !== item.pharmacyId) {
              if (!confirm('Your cart has items from another pharmacy. Clear cart and add this?')) return;
              cart = { pharmacyId: item.pharmacyId, items: [] };
            }
            cart.pharmacyId = item.pharmacyId;
            const existing = cart.items.find(i => i.drugId === item.drugId);
            if (existing) existing.qty += 1;
            else cart.items.push({ ...item, qty: 1 });
            saveCart(cart);
            showToast('Added to cart', 'success');
          });
        });
      } catch (e) {
        el.innerHTML = `<p class="text-red-500 text-sm text-center py-8">${escapeHtml(e.message)}</p>`;
      }
    }
  </script>
</body>
</html>
