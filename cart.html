<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Cart & Checkout | MiracardiacHealth</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{primary:{DEFAULT:'#0d9488',dark:'#0f766e'},secondary:'#059669'},fontFamily:{sans:['Inter','system-ui','sans-serif']}}}}</script>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://js.paystack.co/v1/inline.js"></script>
</head>
<body class="bg-slate-50">
  <header class="sticky top-0 z-40 bg-white border-b border-slate-200 safe-top">
    <div class="max-w-lg mx-auto px-4 h-14 flex items-center gap-3">
      <a href="pharmacy-search.html" class="text-slate-500">←</a>
      <h1 class="font-bold text-lg">Cart</h1>
    </div>
  </header>

  <main class="max-w-lg mx-auto px-4 py-5 space-y-4">
    <div id="cartItems" class="space-y-2"></div>
    <div id="checkoutSection" class="hidden space-y-4">
      <div class="ah-card p-4 space-y-3">
        <div class="flex justify-between text-sm">
          <span>Subtotal</span>
          <span id="subtotal">₦0</span>
        </div>
        <div>
          <label class="block text-xs font-medium mb-1">Delivery method</label>
          <select id="deliveryMethod" class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm">
            <option value="pickup">Pickup</option>
            <option value="delivery">Delivery</option>
          </select>
        </div>
        <div id="addressField" class="hidden">
          <label class="block text-xs font-medium mb-1">Delivery Address</label>
          <textarea id="address" rows="2" class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm"></textarea>
        </div>
        <div>
          <label class="block text-xs font-medium mb-1">Phone</label>
          <input id="phone" type="tel" class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm" />
        </div>
      </div>
      <button id="checkoutBtn" class="btn-primary w-full">Place Order</button>
    </div>
  </main>

  <script type="module">
    import {auth, db, requireAuth, showToast, showEmpty, escapeHtml, formatCurrency,
      collection, addDoc, doc, getDoc, serverTimestamp, payWithPaystack, generateRef, applyPlatformBranding} from './js/config.js';

    applyPlatformBranding();
    const profile = await requireAuth();

    function getCart() {
      try { return JSON.parse(localStorage.getItem('mh_cart') || '{"pharmacyId":null,"items":[]}'); }
      catch { return { pharmacyId: null, items: [] }; }
    }
    function saveCart(cart) {
      localStorage.setItem('mh_cart', JSON.stringify(cart));
      render();
    }

    function render() {
      const cart = getCart();
      const el = document.getElementById('cartItems');
      if (!cart.items.length) {
        showEmpty(el, 'Your cart is empty', '🛒');
        document.getElementById('checkoutSection').classList.add('hidden');
        return;
      }
      document.getElementById('checkoutSection').classList.remove('hidden');
      let total = 0;
      el.innerHTML = cart.items.map((item, idx) => {
        total += item.price * item.qty;
        return `
          <div class="ah-card p-3 flex justify-between items-center">
            <div>
              <p class="font-semibold text-sm">${escapeHtml(item.name)}</p>
              <p class="text-xs text-slate-500">${formatCurrency(item.price)} × ${item.qty}</p>
            </div>
            <div class="flex items-center gap-2">
              <button data-idx="${idx}" class="qty-minus w-7 h-7 rounded-full bg-slate-100 text-sm">−</button>
              <span class="text-sm font-medium">${item.qty}</span>
              <button data-idx="${idx}" class="qty-plus w-7 h-7 rounded-full bg-slate-100 text-sm">+</button>
            </div>
          </div>`;
      }).join('');
      document.getElementById('subtotal').textContent = formatCurrency(total);

      el.querySelectorAll('.qty-plus').forEach(btn => {
        btn.onclick = () => {
          const c = getCart();
          c.items[btn.dataset.idx].qty += 1;
          saveCart(c);
        };
      });
      el.querySelectorAll('.qty-minus').forEach(btn => {
        btn.onclick = () => {
          const c = getCart();
          c.items[btn.dataset.idx].qty -= 1;
          if (c.items[btn.dataset.idx].qty <= 0) c.items.splice(btn.dataset.idx, 1);
          if (!c.items.length) c.pharmacyId = null;
          saveCart(c);
        };
      });
    }

    document.getElementById('deliveryMethod').onchange = (e) => {
      document.getElementById('addressField').classList.toggle('hidden', e.target.value !== 'delivery');
    };

    document.getElementById('checkoutBtn').onclick = async () => {
      const cart = getCart();
      if (!cart.items.length) return;
      const method = document.getElementById('deliveryMethod').value;
      const address = document.getElementById('address').value.trim();
      const phone = document.getElementById('phone').value.trim();
      if (method === 'delivery' && !address) return showToast('Enter delivery address', 'warning');
      if (!phone) return showToast('Enter phone number', 'warning');

      const total = cart.items.reduce((s, i) => s + i.price * i.qty, 0);
      const needsRx = cart.items.some(i => i.requiresPrescription);

      // Get pharmacy owner
      let pharmacyOwnerId = null;
      try {
        const pSnap = await getDoc(doc(db, 'pharmacies', cart.pharmacyId));
        if (pSnap.exists()) pharmacyOwnerId = pSnap.data().ownerId;
      } catch {}

      const orderData = {
        patientId: profile.uid,
        patientName: profile.displayName || profile.email,
        pharmacyId: cart.pharmacyId,
        pharmacyOwnerId,
        items: cart.items,
        total,
        deliveryMethod: method,
        address: method === 'delivery' ? address : null,
        phone,
        status: 'placed',
        paymentStatus: 'pending',
        requiresPrescription: needsRx,
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      };

      // Optional: pay with Paystack
      const payNow = confirm(`Total: ${formatCurrency(total)}\n\nPay now with Paystack? (Cancel to place order without payment)`);
      if (payNow) {
        const ref = generateRef('ORDER');
        payWithPaystack({
          email: profile.email,
          amount: total,
          reference: ref,
          metadata: { purpose: 'order', pharmacyId: cart.pharmacyId },
          onSuccess: async (response) => {
            orderData.paymentStatus = 'success';
            orderData.paymentRef = response.reference;
            await addDoc(collection(db, 'orders'), orderData);
            await addDoc(collection(db, 'payments'), {
              userId: profile.uid,
              amount: total,
              reference: response.reference,
              purpose: 'order',
              status: 'success',
              createdAt: serverTimestamp()
            });
            localStorage.removeItem('mh_cart');
            showToast('Order placed & paid!', 'success');
            setTimeout(() => location.href = 'Dashboard.html', 1200);
          },
          onCancel: () => showToast('Payment cancelled', 'warning')
        });
      } else {
        await addDoc(collection(db, 'orders'), orderData);
        localStorage.removeItem('mh_cart');
        showToast('Order placed!', 'success');
        setTimeout(() => location.href = 'Dashboard.html', 1200);
      }
    };

    render();
  </script>
</body>
</html>
